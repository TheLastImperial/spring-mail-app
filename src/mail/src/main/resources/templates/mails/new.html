<html layout:decorate="~{layouts/main}">
<body>
  <div layout:fragment="content">
    <!-- START -->

    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="mb-4">
          <a href="/mails" class="text-decoration-none text-muted">
            <i class="bi bi-arrow-left me-1"></i> Back to mails
          </a>
          <h1 class="h3 fw-bold mt-2">Create new Mail</h1>
          <p class="text-muted mb-0">
            Complete the data to register a new Mail.
          </p>
        </div>

        <div class="form-container">
          <form novalidate
              th:object="${newMailTemplate}"
              th:action="@{/mails/create}"
              method="post"
              enctype="multipart/form-data">
            <div class="mb-3">
              <label class="form-label">
                Name
              </label>
              <input
                type="text"
                class="form-control"
                required
                maxlength="100"
                th:field="*{id}">
            </div>
            <div class="mb-3">
              <label class="form-label">
                Description
              </label>
              <input
                type="text"
                class="form-control"
                required
                maxlength="100"
                th:field="*{description}">
            </div>
            <div class="mb-3">
              <label class="form-label">
                Subject
              </label>
              <input
                type="text"
                class="form-control"
                required
                maxlength="100"
                th:field="*{subject}">
            </div>
            <div class="mb-3">
              <label class="form-label">
                Content
              </label>
              <textarea
                type="text"
                class="form-control"
                required
                rows="10"
                th:field="*{content}">
              </textarea>
            </div>
            <div class="d-flex flex-wrap gap-2 justify-content-end">
              <a th:href="@{/mails}" class="btn btn-secondary">
                  Cancel
              </a>
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- END -->
  </div>
</body>
</html>
