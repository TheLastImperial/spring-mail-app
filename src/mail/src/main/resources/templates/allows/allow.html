<html layout:decorate="~{layouts/main}">
<head>
  <style>
    .mails-allow-content{
      max-height: 300px;
    }
  </style>
</head>
<body>
  <div layout:fragment="content">
    <!-- START -->

    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="mb-4">
          <a href="/mails-allows" class="text-decoration-none text-muted">
            <i class="bi bi-arrow-left me-1"></i> Back to mails allows
          </a>
          <h1 class="h3 fw-bold mt-2">Allow emails</h1>
          <p class="text-muted mb-0">
            Set all the emails to allow delimited by ','.
            Max 1000 caracteres
          </p>
        </div>

        <div class="form-container">
          <form novalidate
              th:object="${newMailAllow}"
              th:action="@{/mails-allows/allow}"
              method="post"
              enctype="multipart/form-data">
            <div class="mb-3">
              <label class="form-label">
                Emails
              </label>
              <textarea
                type="text"
                class="form-control mails-allow-content"
                required
                rows="1000"
                th:field="*{emails}">
              </textarea>
            </div>
            <div class="d-flex flex-wrap gap-2 justify-content-end">
              <a th:href="@{/mails-allows}" class="btn btn-secondary">
                  Cancel
              </a>
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- END -->
  </div>
</body>
</html>
